[project]
name = "soundcue-inference"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.116.1",
  "imageio-ffmpeg==0.6.0",
  "joblib==1.5.2",
  "librosa==0.11.0",
  "numpy==2.3.2",
  "scikit-learn==1.9.0",
  "torch==2.8.0",
  "transformers==4.57.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"soundcue_inference/vendor_stubs/**/*.pyi" = ["F401"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
